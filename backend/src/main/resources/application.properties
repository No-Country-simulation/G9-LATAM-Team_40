# ==========================================
# Spring Boot Application Configuration
# ==========================================
spring.application.name=TechContent AI
server.port=8080

# ==========================================
# ML Service Configuration (FastAPI)
# ==========================================
ml.service.url=http://ml-service:5000

# ==========================================
# OCI Configuration (Oracle Cloud Infrastructure)
# ==========================================
oci.namespace=${OCI_NAMESPACE:your-namespace}
oci.region=${OCI_REGION:us-phoenix-1}
oci.tenancy=${OCI_CLI_TENANCY}
oci.user=${OCI_CLI_USER}
oci.fingerprint=${OCI_CLI_FINGERPRINT}
oci.private-key-path=${OCI_CLI_KEY_FILE}
oci.files-bucket=OCI_FILES_BUCKET

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.techcontent.ai.integration=INFO
logging.level.com.techcontent.ai.integration.ml=DEBUG
logging.level.com.techcontent.ai.integration.oci=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/techcontent_ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Security Configuration
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==========================================
# Jackson JSON Configuration
# ==========================================
spring.jackson.deserialization.fail-on-unknown-properties=false