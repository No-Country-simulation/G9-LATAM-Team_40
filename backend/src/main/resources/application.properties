server.port=8080

spring.application.name=techcontent-ai

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techcontent}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator — solo health e info, detalles solo para usuarios autenticados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# HTTP client timeouts para RestClient (MlClient, SupabaseAuthClient)
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
supabase.auth.url=${SUPABASE_AUTH_URL:http://localhost:9999}
supabase.anon.key=${SUPABASE_ANON_KEY:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

# OCI Object Storage
oci.files.bucket=${OCI_FILES_BUCKET:techcontent-files}
oci.cli.user=${OCI_CLI_USER:}
oci.cli.tenancy=${OCI_CLI_TENANCY:}
oci.cli.region=${OCI_CLI_REGION:}
oci.cli.fingerprint=${OCI_CLI_FINGERPRINT:}
oci.cli.key-file=${OCI_CLI_KEY_FILE:}

# CORS — en produccion setear CORS_ALLOWED_ORIGINS al dominio del frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
