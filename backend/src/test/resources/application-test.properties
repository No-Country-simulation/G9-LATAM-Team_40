# Perfil usado SOLO durante los tests de integracion (@ActiveProfiles("test")).
# Usa H2 en memoria en vez del Postgres real, para que los tests no
# dependan de tener una base de datos levantada aparte.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Secreto de JWT de prueba (H2 no valida contra Supabase real, y los
# tests de integracion arman su propio token firmado con este mismo valor).
supabase.jwt.secret=clave-secreta-de-prueba-para-tests-1234567890

ml.service.url=http://localhost:5000
oci.files.bucket=techcontent-files-test