# Base de datos en memoria para tests — reemplaza PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

ml.service.url=http://localhost:19999
ml.internal.token=test-internal-token
supabase.auth.url=http://localhost:19998
supabase.anon.key=test-anon-key
supabase.service.key=test-service-key
supabase.jwt.secret=test-secret-key-for-jwt-signing-minimum-256-bits-xxxxxxxxxxxxxxxxx
supabase.jwks.url=
oci.dataset.bucket=test-bucket
oci.namespace=test-namespace
oci.region=us-phoenix-1
oci.tenancy=
oci.user=
oci.fingerprint=
oci.private-key-path=
grafo.local.path=

spring.jpa.properties.hibernate.type.preferred_array_jdbc_type=ARRAY
cors.allowed-origins=*
