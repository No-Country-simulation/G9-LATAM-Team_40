version: '3.8'

services:
  app:
    build:
      context: ..                  # Raíz del repositorio
      dockerfile: docker/Dockerfile
      args:
        SPACY_MODEL: ${SPACY_MODEL:-es_dep_news_trf}
    image: knogment_naye:latest
    container_name: knogment_naye_app

    # Coincide con el puerto expuesto en el Dockerfile (5000)
    ports:
      - "5000:5000"

    env_file:
      - ../.env

    volumes:
      # 1. Datos y persistencia fuera del contenedor
      - ../db:/app/db

      # 2. Archivo .env como solo lectura
      - ../.env:/app/.env:ro

      # 3. Caché persistente para modelos de Embeddings
      - models_cache:/app/.cache

      # 4. Volúmenes de código fuente para desarrollo (Hot-Reload)
      - ../src:/app/src
      - ../indexacion:/app/indexacion
      - ../settings.py:/app/settings.py

    restart: unless-stopped

volumes:
  models_cache:
    name: knogment_naye_models_cache