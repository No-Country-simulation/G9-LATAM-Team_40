name: techcontent-ai

services:
  # ── Spring Boot API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techcontent-backend
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-techcontent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ML_SERVICE_URL: http://ml-service:5000
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?Configura ML_INTERNAL_TOKEN en .env}
      INDEX_RECONCILE_DELAY_MS: ${INDEX_RECONCILE_DELAY_MS:-5000}
      # Dentro de Compose siempre el GoTrue local. El .env hosted no resuelve en este stack.
      SUPABASE_AUTH_URL: http://supabase-auth:9999
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      OCI_CLI_USER: ${OCI_CLI_USER}
      OCI_CLI_TENANCY: ${OCI_CLI_TENANCY}
      OCI_CLI_REGION: ${OCI_CLI_REGION}
      OCI_CLI_FINGERPRINT: ${OCI_CLI_FINGERPRINT}
      OCI_CLI_KEY_FILE: /run/secrets/oci_api_key.pem
      OCI_DATASET_BUCKET: ${OCI_DATASET_BUCKET}
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_PREFIX: ${OCI_PREFIX:-prod}
      GRAFO_LOCAL_PATH: /app/db/output_json/grafo_nodos_subnodos_graphrag.json
    volumes:
      - type: bind
        source: ${OCI_CLI_KEY_FILE:?Configura OCI_CLI_KEY_FILE en .env}
        target: /run/secrets/oci_api_key.pem
        read_only: true
      - ./datascience/db:/app/db:ro
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Frontend Web (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend/techisolutions
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se inyecta en el bundle en build-time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: techcontent-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Python ML Service (FastAPI) ──────────────────────────────────
  ml-service:
    build:
      context: ./datascience
      dockerfile: docker/Dockerfile
      args:
        SPACY_MODEL: ${SPACY_MODEL:-es_dep_news_trf}
    container_name: techcontent-ml-service
    expose:
      - "5000"
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-oci}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?Configura ML_INTERNAL_TOKEN en .env}
      MAX_USER_INDEX_CACHE: ${MAX_USER_INDEX_CACHE:-8}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_1: ${GEMINI_MODEL_1:-gemini-3.5-flash-lite}
      GEMINI_MODEL_2: ${GEMINI_MODEL_2:-gemini-3.1-flash-lite}
      MODELO_EMBEDDINGS: ${MODELO_EMBEDDINGS:-paraphrase-multilingual-mpnet-base-v2}
      SPACY_MODEL: ${SPACY_MODEL:-es_dep_news_trf}
      BATCH_SIZE_EMBEDDINGS: ${BATCH_SIZE_EMBEDDINGS:-32}
      DOCUMENTOS_POR_LOTE: ${DOCUMENTOS_POR_LOTE:-5}
      MAX_CATEGORIAS_POR_DOCUMENTO: ${MAX_CATEGORIAS_POR_DOCUMENTO:-10}
      UMBRAL_CONFIANZA: ${UMBRAL_CONFIANZA:-0.60}
      CONCEPTOS_TOP_POR_SECCION: ${CONCEPTOS_TOP_POR_SECCION:-5}
      CONFIANZA_MINIMA_RELACION: ${CONFIANZA_MINIMA_RELACION:-0.75}
      SCORE_MINIMO_CONCEPTO: ${SCORE_MINIMO_CONCEPTO:-0.65}
      TOP_K_NODOS: ${TOP_K_NODOS:-5}
      TOP_K_SECCIONES_FINAL: ${TOP_K_SECCIONES_FINAL:-5}
      OCI_DATASET_BUCKET: ${OCI_DATASET_BUCKET:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_PREFIX: ${OCI_PREFIX:-prod}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-api_key}
      OCI_SYNC_ON_STARTUP: ${OCI_SYNC_ON_STARTUP:-true}
      OCI_CLI_USER: ${OCI_CLI_USER:-}
      OCI_CLI_TENANCY: ${OCI_CLI_TENANCY:-}
      OCI_CLI_REGION: ${OCI_CLI_REGION:-}
      OCI_CLI_FINGERPRINT: ${OCI_CLI_FINGERPRINT:-}
      OCI_CLI_KEY_FILE: /run/secrets/oci_api_key.pem
    volumes:
      - ./datascience/db:/app/db
      - type: bind
        source: ${OCI_CLI_KEY_FILE:?Configura OCI_CLI_KEY_FILE en .env}
        target: /run/secrets/oci_api_key.pem
        read_only: true
      - ml-models-cache:/app/.cache
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase PostgreSQL ──────────────────────────────────────────
  db:
    image: supabase/postgres:15.1.0.147
    container_name: techcontent-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techcontent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./docker/gotrue-stamp-migrations.sql:/docker-entrypoint-initdb.d/99-gotrue-stamp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techcontent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase Auth (GoTrue) ───────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: techcontent-supabase-auth
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techcontent}?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase REST (PostgREST) ────────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    container_name: techcontent-supabase-rest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techcontent}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-postgres}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase Studio / Meta ───────────────────────────────────────
  supabase-meta:
    image: supabase/studio:20231123-64a766a
    container_name: techcontent-supabase-meta
    ports:
      - "8000:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SUPABASE_URL: http://supabase-meta:3000
      SUPABASE_REST_URL: http://supabase-rest:3000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-techcontent}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

networks:
  techcontent-net:
    driver: bridge

volumes:
  supabase-db-data:
    driver: local
  ml-models-cache:
    driver: local
