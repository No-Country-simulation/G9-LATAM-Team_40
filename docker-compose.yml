name: techcontent-ai

services:
  # ── Spring Boot API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techcontent-backend
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-techcontent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ML_SERVICE_URL: http://ml-service:5000
      SUPABASE_AUTH_URL: http://supabase-auth:9999
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      OCI_CLI_USER: ${OCI_CLI_USER}
      OCI_CLI_TENANCY: ${OCI_CLI_TENANCY}
      OCI_CLI_REGION: ${OCI_CLI_REGION}
      OCI_CLI_FINGERPRINT: ${OCI_CLI_FINGERPRINT}
      OCI_CLI_KEY_FILE: ${OCI_CLI_KEY_FILE}
      OCI_MODEL_BUCKET: ${OCI_MODEL_BUCKET}
      OCI_DATASET_BUCKET: ${OCI_DATASET_BUCKET}
      OCI_FILES_BUCKET: ${OCI_FILES_BUCKET}
    depends_on:
      db:
        condition: service_healthy
      supabase-auth:
        condition: service_started
      ml-service:
        condition: service_started
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Frontend Web (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend/techisolutions
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se inyecta en el bundle en build-time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: techcontent-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Python ML Service (FastAPI) ──────────────────────────────────
  ml-service:
    build:
      context: ./datascience
      dockerfile: Dockerfile
    container_name: techcontent-ml-service
    ports:
      - "${ML_SERVICE_PORT:-5000}:5000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-./models/classifier.joblib}
      OCI_CLI_USER: ${OCI_CLI_USER}
      OCI_CLI_TENANCY: ${OCI_CLI_TENANCY}
      OCI_CLI_REGION: ${OCI_CLI_REGION}
      OCI_CLI_FINGERPRINT: ${OCI_CLI_FINGERPRINT}
      OCI_CLI_KEY_FILE: ${OCI_CLI_KEY_FILE}
      OCI_MODEL_BUCKET: ${OCI_MODEL_BUCKET}
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase PostgreSQL ──────────────────────────────────────────
  db:
    image: supabase/postgres:15.1.0.147
    container_name: techcontent-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techcontent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techcontent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase Auth (GoTrue) ───────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: techcontent-supabase-auth
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techcontent}?sslmode=disable
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase REST (PostgREST) ────────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    container_name: techcontent-supabase-rest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techcontent}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-postgres}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

  # ── Supabase Studio / Meta ───────────────────────────────────────
  supabase-meta:
    image: supabase/studio:20231123-64a766a
    container_name: techcontent-supabase-meta
    ports:
      - "8000:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SUPABASE_URL: http://supabase-meta:3000
      SUPABASE_REST_URL: http://supabase-rest:3000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-techcontent}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcontent-net
    restart: unless-stopped

networks:
  techcontent-net:
    driver: bridge

volumes:
  supabase-db-data:
    driver: local
